name: SteadyCron Sync
description: >
  Plan or apply a SteadyCron manifest. On pull requests it posts a plan diff as a sticky
  PR comment; on push to the default branch it applies the manifest.

author: SteadyCron

branding:
  icon: clock
  color: blue

inputs:
  manifest-path:
    description: >
      Path to the manifest file or directory (glob of *.yaml/*.yml inside a directory).
      Defaults to the repo root.
    required: false
    default: .
  namespace:
    description: Account namespace. Required when using prune.
    required: false
    default: ""
  prune:
    description: Delete server resources not declared in the manifest.
    required: false
    default: "false"
  api-key:
    description: SteadyCron API key (sc_…). Pass via secrets.STEADYCRON_API_KEY.
    required: true
  cli-version:
    description: CLI version to install (e.g. "1.2.0"). Defaults to latest.
    required: false
    default: latest
  mode:
    description: >
      Execution mode: "plan" (dry-run + PR comment), "apply" (apply --yes), or "auto"
      (plan on pull_request events, apply on push to default branch).
    required: false
    default: auto

outputs:
  plan-json:
    description: The raw server plan JSON from `steadycron plan --output json`.
    value: ${{ steps.plan.outputs.plan_json }}
  has-drift:
    description: "true" when the plan detected changes.
    value: ${{ steps.plan.outputs.has_drift }}

runs:
  using: composite
  steps:
    # ── Install CLI ────────────────────────────────────────────────────────────────
    - name: Install SteadyCron CLI
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        if [ "$CLI_VERSION" = "latest" ]; then
          VERSION=$(curl -sf https://api.github.com/repos/steadycron/cli/releases/latest \
            | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
        else
          VERSION="$CLI_VERSION"
        fi

        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ARCH="x64" ;;
          aarch64|arm64) ARCH="arm64" ;;
          *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
        esac

        ARCHIVE="steadycron-${VERSION}-${OS}-${ARCH}.tar.gz"
        URL="https://github.com/steadycron/cli/releases/download/v${VERSION}/${ARCHIVE}"

        echo "Installing SteadyCron CLI v${VERSION} (${OS}/${ARCH})…"
        curl -sfL "$URL" | tar -xz -C /usr/local/bin steadycron
        chmod +x /usr/local/bin/steadycron
        steadycron --version

    # ── Resolve mode ──────────────────────────────────────────────────────────────
    - name: Resolve mode
      id: mode
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        MODE="$INPUT_MODE"
        if [ "$MODE" = "auto" ]; then
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            MODE="plan"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "$GITHUB_DEFAULT_BRANCH" ]; then
            MODE="apply"
          else
            MODE="plan"
          fi
        fi
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        echo "Resolved mode: $MODE"

    # ── Run plan ──────────────────────────────────────────────────────────────────
    - name: Plan
      id: plan
      if: steps.mode.outputs.mode == 'plan'
      shell: bash
      env:
        STEADYCRON_API_KEY: ${{ inputs.api-key }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        NAMESPACE: ${{ inputs.namespace }}
        PRUNE: ${{ inputs.prune }}
      run: |
        set -euo pipefail

        ARGS=("$MANIFEST_PATH" --output json --detailed-exitcode)
        [ -n "$NAMESPACE" ] && ARGS+=(--namespace "$NAMESPACE")
        [ "$PRUNE" = "true" ] && ARGS+=(--prune)

        PLAN_JSON=$(steadycron plan "${ARGS[@]}") && EXIT=$? || EXIT=$?

        echo "plan_json<<EOF" >> "$GITHUB_OUTPUT"
        echo "$PLAN_JSON" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        # exit 2 means drift; anything else (0 = clean, 5 = errors) is handled below
        if [ $EXIT -eq 2 ]; then
          echo "has_drift=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_drift=false" >> "$GITHUB_OUTPUT"
        fi

        # Propagate errors (exit 5) but treat drift (exit 2) as success for this step
        if [ $EXIT -ne 0 ] && [ $EXIT -ne 2 ]; then
          exit $EXIT
        fi

    # ── Post PR comment ──────────────────────────────────────────────────────────
    - name: Post plan as PR comment
      if: steps.mode.outputs.mode == 'plan' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PLAN_JSON: ${{ steps.plan.outputs.plan_json }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        MARKER="<!-- steadycron-plan-comment -->"

        # Format the plan JSON into a markdown summary
        CREATES=$(echo "$PLAN_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('creates',[])))")
        UPDATES=$(echo "$PLAN_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('updates',[])))")
        DELETES=$(echo "$PLAN_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('deletes',[])))")
        ERRORS=$(echo "$PLAN_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('errors',[])))")

        HEADER="## SteadyCron Plan — \`${SHA:0:7}\`"
        if [ "$ERRORS" -gt 0 ]; then
          STATUS="❌ **Plan has errors — apply blocked.** Fix them before merging."
        elif [ "$CREATES" -eq 0 ] && [ "$UPDATES" -eq 0 ] && [ "$DELETES" -eq 0 ]; then
          STATUS="✅ No drift detected."
        else
          STATUS="📋 **${CREATES} to create · ${UPDATES} to update · ${DELETES} to delete**"
        fi

        BODY="${MARKER}
        ${HEADER}

        ${STATUS}

        <details>
        <summary>Raw plan JSON</summary>

        \`\`\`json
        ${PLAN_JSON}
        \`\`\`

        </details>

        > Triggered by commit \`${SHA:0:7}\`. Re-run the workflow to refresh."

        # Find existing comment with the marker
        EXISTING_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)

        if [ -n "$EXISTING_ID" ]; then
          gh api "repos/${REPO}/issues/comments/${EXISTING_ID}" \
            -X PATCH --field "body=${BODY}" > /dev/null
          echo "Updated existing plan comment #${EXISTING_ID}"
        else
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --field "body=${BODY}" > /dev/null
          echo "Posted new plan comment"
        fi

    # ── Fail check if plan has errors ────────────────────────────────────────────
    - name: Fail on plan errors
      if: steps.mode.outputs.mode == 'plan'
      shell: bash
      env:
        PLAN_JSON: ${{ steps.plan.outputs.plan_json }}
      run: |
        ERRORS=$(echo "$PLAN_JSON" | python3 -c \
          "import sys,json; d=json.load(sys.stdin); print(len(d.get('errors',[])))")
        if [ "$ERRORS" -gt 0 ]; then
          echo "::error::SteadyCron plan has $ERRORS error(s). See the PR comment for details."
          exit 1
        fi

    # ── Apply ─────────────────────────────────────────────────────────────────────
    - name: Apply
      if: steps.mode.outputs.mode == 'apply'
      shell: bash
      env:
        STEADYCRON_API_KEY: ${{ inputs.api-key }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        NAMESPACE: ${{ inputs.namespace }}
        PRUNE: ${{ inputs.prune }}
      run: |
        set -euo pipefail

        ARGS=("$MANIFEST_PATH" --yes)
        [ -n "$NAMESPACE" ] && ARGS+=(--namespace "$NAMESPACE")
        [ "$PRUNE" = "true" ] && ARGS+=(--prune)

        steadycron apply "${ARGS[@]}"
