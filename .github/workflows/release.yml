name: Release

# Tag a release to publish, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub Release and upload assets

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release

  pack-and-push:
    name: Pack & push NuGet tool
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pack global tool
        run: dotnet pack src/SteadyCron.Cli/SteadyCron.Cli.csproj -c Release -p:Version=$VERSION -o artifacts

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  binaries:
    name: Build self-contained binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Single-file self-contained binaries cross-publish from a single host (these are not NativeAOT).
      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/SteadyCron.Cli/SteadyCron.Cli.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=$VERSION
          -o publish/${{ matrix.rid }}

      - name: Stage named binary
        run: |
          mkdir -p dist
          if [ -f "publish/${{ matrix.rid }}/steadycron.exe" ]; then
            cp "publish/${{ matrix.rid }}/steadycron.exe" "dist/steadycron-${{ matrix.rid }}.exe"
          else
            cp "publish/${{ matrix.rid }}/steadycron" "dist/steadycron-${{ matrix.rid }}"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [pack-and-push, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Collect release assets
        run: |
          mkdir -p release
          find incoming -type f \( -name 'steadycron-*' -o -name '*.nupkg' \) -exec cp {} release/ \;
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  mirror-action:
    name: Mirror to steadycron/action
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push action.yml and tags to steadycron/action
        env:
          GH_TOKEN: ${{ secrets.ACTION_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git clone "https://x-access-token:${GH_TOKEN}@github.com/steadycron/action.git" action-repo
          cp action/action.yml action-repo/action.yml

          cd action-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add action.yml

          if git diff --staged --quiet; then
            echo "action.yml unchanged — skipping commit"
          else
            git commit -m "chore: sync action.yml from cli ${TAG}"
            git push
          fi

          # Specific version tag (e.g. v1.3.0)
          git tag "${TAG}"
          git push origin "${TAG}"

          # Floating major version tag (e.g. v1) — force-move on each release
          MAJOR_TAG=$(echo "${TAG}" | grep -oP '^v\d+')
          git tag -f "${MAJOR_TAG}"
          git push --force origin "${MAJOR_TAG}"
