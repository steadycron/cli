# SteadyCron: plan on pull requests and post the diff as a sticky PR comment.
# The check fails if the plan has errors (limit violations, namespace conflicts, etc.).
#
# Prerequisites:
#   - Add your API key as a repository secret: STEADYCRON_API_KEY
#   - Give the workflow write permission on pull-request comments (see permissions below)

name: SteadyCron Plan

on:
  pull_request:
    paths:
      - "steadycron/**"   # only run when manifest files change
      - "steadycron.yaml"

permissions:
  contents: read
  pull-requests: write   # required to post the plan comment

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./action   # use the bundled action (or: steadycron/sync-action@v1 once published)
        with:
          manifest-path: steadycron/
          namespace: prod
          api-key: ${{ secrets.STEADYCRON_API_KEY }}
          mode: plan
          # prune: "true"   # uncomment if you want --prune reflected in the plan diff
