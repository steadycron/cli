# SteadyCron: apply the manifest on every push to main.
# Runs after a PR is merged, keeping the account in sync with the repository.
#
# Prerequisites:
#   - Add your API key as a repository secret: STEADYCRON_API_KEY

name: SteadyCron Apply

on:
  push:
    branches:
      - main
    paths:
      - "steadycron/**"   # only apply when manifest files change
      - "steadycron.yaml"

permissions:
  contents: read

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./action   # use the bundled action (or: steadycron/sync-action@v1 once published)
        with:
          manifest-path: steadycron/
          namespace: prod
          prune: "true"   # delete server resources removed from the manifest
          api-key: ${{ secrets.STEADYCRON_API_KEY }}
          mode: apply
